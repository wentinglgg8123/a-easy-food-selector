[project]
name = "food-picker"
version = "2.1.0"
description = "以 Python 製作的 Excel 美食探索與隨機推薦網站"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["browser: real Chromium browser checks (run separately)"]
addopts = "-m 'not browser'"

[tool.ruff]
line-length = 100
target-version = "py312"
